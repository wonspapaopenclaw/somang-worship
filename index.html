<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173b36" />
    <title>주일예배 | 소망교회</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">소망교회 · 예배 안내</p>
          <h1>주일예배</h1>
          <p id="issue-label" class="muted">주보를 불러오는 중입니다.</p>
        </div>
        <button id="font-toggle" class="icon-button" type="button" aria-pressed="false">큰 글씨</button>
      </header>

      <section class="bulletin-picker" aria-labelledby="bulletin-picker-heading">
        <label for="bulletin-select">
          <span id="bulletin-picker-heading" class="picker-label">보관 주보 선택</span>
          <select id="bulletin-select" aria-label="보관 주보 선택" aria-describedby="bulletin-picker-status"></select>
        </label>
        <p id="bulletin-picker-status" class="muted">보관된 주보를 선택하면 해당 예배 내용을 볼 수 있습니다.</p>
      </section>

      <section class="time-panel" aria-labelledby="time-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">예배 시간</p>
            <h2 id="time-heading">참여할 예배를 선택하세요</h2>
          </div>
        </div>
        <div id="time-tabs" class="time-tabs" role="tablist" aria-label="예배 시간"></div>
      </section>

      <section id="service-summary" class="summary-card"></section>
      <section id="worship-order" class="order-list" aria-live="polite"></section>

      <footer class="footer">
        <p>자료 기준: 선택한 소망교회 주보 1페이지</p>
        <a id="source-link" href="#" target="_blank" rel="noreferrer">원문 주보 열기</a>
      </footer>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
